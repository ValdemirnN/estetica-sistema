# Agendador do envio de avisos (WhatsApp / e-mail): chama o worker a cada ~15 min.
# Funciona em qualquer plano da Vercel. Configure em GitHub -> Settings -> Secrets and variables -> Actions:
#   APP_URL      = https://seu-dominio.com   (sem barra no final)
#   CRON_SECRET  = o mesmo valor da variável CRON_SECRET na Vercel
# Obs.: o GitHub pode atrasar execuções agendadas em alguns minutos. Se a Vercel tiver "Deployment Protection"
# ligada para o domínio, libere o caminho /api/notify/* (ou use o domínio de produção).
name: notify-worker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Executar worker de avisos
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Defina os secrets APP_URL e CRON_SECRET."; exit 1; fi
          curl --fail-with-body --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/notify/reminders"
